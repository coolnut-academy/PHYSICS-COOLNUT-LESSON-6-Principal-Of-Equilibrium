<!DOCTYPE html>
<html lang="th" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Moment Lab | สมดุลต่อการหมุน — ฟิสิกส์ ม.4</title>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('momentlab.v1.theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch (e) { }
    })();
  </script>
  <!-- Thai Sarabun Typography + KaTeX LaTeX Math (graceful offline fallback built in) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <a class="skip-link" href="#main-content">ข้ามไปยังเนื้อหาหลัก</a>

  <!-- Top Application Header -->
  <header class="app-header" id="app-header">
    <div class="header-inner">
      <div class="brand-group">
        <button type="button" class="brand-btn" id="brand-home-btn" aria-label="Moment Lab หน้าหลัก">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 36 36" width="30" height="30" fill="none">
              <path d="M8 14 L6 5 L14 10 Z" fill="#FF9442" stroke="#D95B14" stroke-width="1.2" stroke-linejoin="round" />
              <path d="M28 14 L30 5 L22 10 Z" fill="#FF9442" stroke="#D95B14" stroke-width="1.2" stroke-linejoin="round" />
              <ellipse cx="18" cy="20" rx="12" ry="10.5" fill="#FFA454" stroke="#D95B14" stroke-width="1.2" />
              <ellipse cx="18" cy="23.2" rx="7.5" ry="5.5" fill="#FFF3E4" />
              <path d="M16 10.5 L16 13.5 M18 10 L18 14 M20 10.5 L20 13.5" stroke="#D95B14" stroke-width="1.3" stroke-linecap="round" />
              <circle cx="13.5" cy="18.5" r="1.7" fill="#2B1B12" />
              <circle cx="22.5" cy="18.5" r="1.7" fill="#2B1B12" />
              <circle cx="14.1" cy="18" r="0.55" fill="#FFFFFF" />
              <circle cx="23.1" cy="18" r="0.55" fill="#FFFFFF" />
              <ellipse cx="10.8" cy="21" rx="2" ry="1.2" fill="#FF8FAB" opacity="0.82" />
              <ellipse cx="25.2" cy="21" rx="2" ry="1.2" fill="#FF8FAB" opacity="0.82" />
              <path d="M16.5 21.2 Q18 22.7 19.5 21.2" stroke="#2B1B12" stroke-width="1.2" stroke-linecap="round" fill="none" />
              <polygon points="17.1,19.8 18.9,19.8 18,20.9" fill="#FF7B9C" />
            </svg>
          </span>
          <span class="brand-text">
            <span class="brand-title">Moment Lab 🐾</span>
            <span class="brand-sub">ฟิสิกส์ ม.4 · แมวส้มสมดุลต่อการหมุน</span>
          </span>
        </button>
      </div>

      <div class="header-controls">
        <span class="mode-pill" id="header-mode-pill" aria-live="off">หน้าหลัก</span>
        <button type="button" class="icon-btn theme-toggle" id="theme-toggle-btn" aria-label="สลับโหมดสี สว่าง/มืด"
          title="สลับโหมดสี Dark / Light">
          <span class="theme-icon-dark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4"></circle>
              <path
                d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41">
              </path>
            </svg>
          </span>
          <span class="theme-icon-light" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </span>
          <span class="theme-label" id="theme-toggle-label">โหมดมืด</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Live Banners Region (Incident Notice / Storage Error / Concurrent Tab) -->
  <div class="banner-stack" id="banner-stack" aria-live="polite"></div>

  <!-- Screen-reader-only timer milestones (5m, 1m, timeout only) -->
  <div class="sr-only" id="timer-sr-announce" aria-live="assertive" aria-atomic="true"></div>

  <!-- Main Dynamic Application Container -->
  <main class="app-main" id="main-content" tabindex="-1"></main>

  <!-- In-Page Modal Dialog Root (Zero alert() / confirm()) -->
  <div class="modal-backdrop hidden" id="modal-backdrop" role="presentation">
    <div class="modal-dialog" id="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title"></h2>
        <button type="button" class="icon-btn modal-close-btn" id="modal-close-btn" aria-label="ปิดหน้าต่าง">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>

  <!-- Subtle Bottom-Left Teacher Analytics Key Icon (Read-Only Dashboard) -->
  <button type="button" class="teacher-key-fab no-print" id="teacher-key-btn" aria-label="เปิด Dashboard สถิติการใช้งาน (สำหรับครู)" title="Dashboard สถิติการใช้งาน (Read-Only)">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="7.5" cy="15.5" r="5.5"></circle>
      <path d="m21 2-9.6 9.6"></path>
      <path d="m15.5 7.5 3 3L22 7l-3-3"></path>
    </svg>
  </button>

  <!-- Print-only Official Footer -->
  <footer class="print-footer">
    Moment Lab — สมดุลต่อการหมุน (ฟิสิกส์ ม.4) · แหล่งเวลา: นาฬิกาอุปกรณ์ (ไม่ใช่เวลาจากเซิร์ฟเวอร์)
  </footer>

  <!-- Core Scripts (Classic order for GitHub Pages + local file:// compatibility) -->
  <script src="js/physics.js"></script>
  <script src="js/svg.js"></script>
  <script src="js/exam.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/celebrate.js"></script>
  <script src="js/ui.js"></script>
</body>

</html>
